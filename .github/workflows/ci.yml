# Runs the same checks as "Before calling something done" in CLAUDE.md on every
# PR and every push to main, plus a web and Android build and expo-doctor.
# The jobs run in parallel so a failure shows which part broke.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # functions/ requires Node 24 (its package.json "engines").
  NODE_VERSION: 24

jobs:
  app:
    name: App (typecheck, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --ci

  functions:
    name: Functions (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  emulator-tests:
    name: Rules and functions tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      # The Firestore emulator needs Java 21+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # firebase-tools downloads the emulator .jar on first use; keep it
      # between runs. The key follows the root lockfile, which pins
      # firebase-tools.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run test:rules
      - run: npm run test:functions

  export:
    name: Build (web, Android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The web export renders every page, which starts Firebase, and
      # Firebase rejects a missing API key. These dummy values never reach a
      # server: the build only needs them to be present.
      EXPO_PUBLIC_FIREBASE_API_KEY: ci-dummy-key
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-vadfanskavihandla.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-vadfanskavihandla
      EXPO_PUBLIC_FIREBASE_APP_ID: 1:0:web:0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist/web
      - run: npx expo export --platform android --output-dir dist/android

  expo-doctor:
    name: Expo doctor (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports SDK version mismatches and config problems. Some of its checks
    # depend on Expo's servers, so a failure here doesn't fail the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx -y expo-doctor
